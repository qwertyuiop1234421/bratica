<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title">
  <title id="title">BRATICA Fight Club Emblem</title>
  <defs>
    <!-- Неоновый спортивный градиент буквы B и рамки -->
    <linearGradient id="neonGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9eff"/>
      <stop offset="30%" stop-color="#cc3eff"/>
      <stop offset="70%" stop-color="#9100e6"/>
      <stop offset="100%" stop-color="#510099"/>
    </linearGradient>

    <!-- Мягкий 3D-блик на букве -->
    <linearGradient id="letterGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Скругленная рамка с прозрачным фоном внутри -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="none" stroke="url(#neonGlow)" stroke-width="4"/>

  <!-- Внутренняя легкая стеклянная грань -->
  <rect x="13" y="13" width="94" height="94" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Буква B по центру со спортивным наклоном, объемным бликом и прозрачным фоном -->
  <g transform="translate(60, 60) skewX(-10) translate(-50, -52)">
    <!-- Основное тело буквы -->
    <path d="M28 20h30c14 0 23 7 23 18 0 7-4 13-11 15 9 2 14 9 14 18 0 12-10 20-26 20H28V20zm20 14v13h8c5 0 8-2 8-6s-3-7-8-7h-8zm0 24v15h9c6 0 9-3 9-7 0-4-3-8-9-8h-9z" fill="url(#neonGlow)"/>
    <!-- Верхняя световая грань буквы -->
    <path d="M28 20h30c14 0 23 7 23 18 0 7-4 13-11 15 9 2 14 9 14 18 0 12-10 20-26 20H28V20zm20 14v13h8c5 0 8-2 8-6s-3-7-8-7h-8zm0 24v15h9c6 0 9-3 9-7 0-4-3-8-9-8h-9z" fill="url(#letterGloss)"/>
  </g>
</svg>
