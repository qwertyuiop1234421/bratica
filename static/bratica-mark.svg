<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title">
  <title id="title">BRATICA Fight Club Logo</title>
  <defs>
    <!-- Глубокий объемный градиент для плашки -->
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221535"/>
      <stop offset="50%" stop-color="#150d22"/>
      <stop offset="100%" stop-color="#090510"/>
    </linearGradient>

    <!-- Премиальный фиолетово-неоновый градиент буквы B -->
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0abff"/>
      <stop offset="35%" stop-color="#bd43ff"/>
      <stop offset="75%" stop-color="#831adb"/>
      <stop offset="100%" stop-color="#51058a"/>
    </linearGradient>

    <!-- Многослойная объемная тень -->
    <filter id="ultraShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8010d5" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Внутреннее свечение буквы -->
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f3b5ff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Внешняя подложка с ультра-тесненым контуром -->
  <rect x="6" y="6" width="108" height="108" rx="32" fill="var(--logo-plate, url(#plateGrad))" stroke="url(#logoGrad)" stroke-width="4" filter="url(#ultraShadow)"/>

  <!-- Внутренний акцентный контур (эффект 3D-фаски) -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Буква B с объемным тиснением -->
  <path d="M37 26h28c17 0 27 8 27 21 0 8-4 15-12 19 10 3 16 10 16 21 0 16-12 25-32 25H37V26zm21 17v17h8c6 0 9-3 9-9 0-5-3-8-9-8h-8zm0 32v18h9c7 0 10-4 10-10 0-5-3-8-10-8h-9z" fill="url("logoGrad")" filter="url(#innerGlow)"/>
</svg>
