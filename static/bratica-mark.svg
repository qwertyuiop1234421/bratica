<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title">
  <title id="title">BRATICA Fight Club Emblem</title>
  <defs>
    <!-- Основной неоновый премиум-градиент для буквы -->
    <linearGradient id="neonGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9eff"/>
      <stop offset="25%" stop-color="#d43bff"/>
      <stop offset="70%" stop-color="#9100e6"/>
      <stop offset="100%" stop-color="#46007a"/>
    </linearGradient>

    <!-- Диагональный глянцевый блик для 3D-объема -->
    <linearGradient id="glossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Глубокие мягкие тени карточки -->
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#7a00cc" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Внутренняя тень и глубина для литеры -->
    <filter id="letterDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="4" stdDeviation="3" flood-color="#120024" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Квадрат-подложка с адаптивным фоном (переменная управляется светлой/темной темой сайта) -->
  <rect x="6" y="6" width="108" height="108" rx="34" fill="var(--logo-plate, #11091a)" stroke="url(#neonGlow)" stroke-width="4" filter="url(#cardShadow)"/>
  
  <!-- Внутренняя тонкая фаска под стекло -->
  <rect x="11" y="11" width="98" height="98" rx="29" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Стильная динамическая буква B с новым современным контуром -->
  <g transform="translate(60, 60) skewX(-10) translate(-50, -52)">
    <!-- Теневая база буквы -->
    <path d="M28 20h30c14 0 23 7 23 18 0 7-4 13-11 15 9 2 14 9 14 18 0 12-10 20-26 20H28V20zm20 14v13h8c5 0 8-2 8-6s-3-7-8-7h-8zm0 24v15h9c6 0 9-3 9-7 0-4-3-8-9-8h-9z" fill="url(#neonGlow)" filter="url(#letterDepth)" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.3"/>
    
    <!-- Глянцевый световой перелив -->
    <path d="M28 20h30c14 0 23 7 23 18 0 7-4 13-11 15 9 2 14 9 14 18 0 12-10 20-26 20H28V20zm20 14v13h8c5 0 8-2 8-6s-3-7-8-7h-8zm0 24v15h9c6 0 9-3 9-7 0-4-3-8-9-8h-9z" fill="url(#glossGrad)" style="mix-blend-mode: overlay;"/>
  </g>
</svg>
