<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title">
  <title id="title">BRATICA Fight Club Emblem</title>
  <defs>
    <!-- Неоновый градиент буквы B -->
    <linearGradient id="bGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb0ff"/>
      <stop offset="30%" stop-color="#cc3eff"/>
      <stop offset="70%" stop-color="#9110e6"/>
      <stop offset="100%" stop-color="#510099"/>
    </linearGradient>

    <!-- Глянцевый блик -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Аккуратная легкая тень без квадратных краев -->
    <filter id="cleanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#8010d5" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="letterDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#120024" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Подложка (адаптируется под тему) -->
  <rect x="6" y="6" width="108" height="108" rx="30" fill="var(--logo-plate, #140e1f)" stroke="url(#bGrad)" stroke-width="3.5" filter="url(#cleanShadow)"/>
  
  <!-- Внутренняя фаска -->
  <rect x="11" y="11" width="98" height="98" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Литера B с наклоном и объемом -->
  <g transform="translate(60, 60) skewX(-10) translate(-50, -52)">
    <path d="M28 20h30c14 0 23 7 23 18 0 7-4 13-11 15 9 2 14 9 14 18 0 12-10 20-26 20H28V20zm20 14v13h8c5 0 8-2 8-6s-3-7-8-7h-8zm0 24v15h9c6 0 9-3 9-7 0-4-3-8-9-8h-9z" fill="url(#bGrad)" filter="url(#letterDepth)" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.25"/>
    <path d="M28 20h30c14 0 23 7 23 18 0 7-4 13-11 15 9 2 14 9 14 18 0 12-10 20-26 20H28V20zm20 14v13h8c5 0 8-2 8-6s-3-7-8-7h-8zm0 24v15h9c6 0 9-3 9-7 0-4-3-8-9-8h-9z" fill="url(#gloss)" style="mix-blend-mode: overlay;"/>
  </g>
</svg>
