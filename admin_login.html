<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход в CRM — BRATICA</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Oswald:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/bratica-2026.css">
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); }
.login-card { width: min(400px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-lg); text-align: center; }
.login-brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; font-family: 'Oswald', sans-serif; font-size: 26px; text-decoration: none; color: var(--text); }
.login-brand img { width: 44px; height: 44px; filter: drop-shadow(0 0 10px var(--accent-glow)); }
.form { display: grid; gap: 14px; text-align: left; margin-top: 20px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 11px; font-weight: 700; color: var(--muted); }
.field input { width: 100%; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); border-radius: var(--radius-sm); padding: 12px; font-size: 13px; outline: none; }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn { width: 100%; padding: 13px; margin-top: 10px; }
.top-right { position: absolute; top: 20px; right: 20px; }
</style>
</head>
<body>

<div class="top-right">
  <button class="theme-toggle" id="themeToggle" type="button"><span>Тема</span><i class="theme-track"></i></button>
</div>

<div class="login-card">
  <a class="login-brand" href="/">
    <img src="/static/bratica-mark.svg" alt="BRATICA">
    <span>BRATICA<small style="display:block;font-size:8px;font-family:Manrope;color:var(--muted);letter-spacing:0.2em">CRM 2026</small></span>
  </a>
  <p style="color:var(--muted);font-size:13px;margin:0">Вход для администраторов клуба</p>
  
  <form class="form" method="POST" action="/admin/login">
    <div class="field">
      <label>Email</label>
      <input type="email5" name="username" required placeholder="admin@bratica.ru">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" name="password" required placeholder="••••••••">
    </div>
    <button class="btn" type="submit">Войти в систему ↗️</button>
  </form>
</div>

<script>
const $=s=>document.querySelector(s);
const root=document.documentElement;
const themeToggle=$('#themeToggle');
function setTheme(t){document.body.classList.toggle('light', t==='light');root.dataset.theme=t;themeToggle.classList.toggle('light', t==='light');localStorage.setItem('bratica-theme', t);}
setTheme(localStorage.getItem('bratica-theme') || 'dark');
themeToggle.onclick=()=>setTheme(root.dataset.theme==='light'?'dark':'light');
</script>
</body>
</html>
