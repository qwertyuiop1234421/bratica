<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<title>BRATICA CRM 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Oswald:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/bratica-2026.css">
<style>
:root { --side-w: 240px; }
body.admin-body { display: flex; min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); }
.side { width: var(--side-w); flex: none; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px; position: sticky; top: 0; height: 100vh; }
.side-nav { display: flex; flex-direction: column; gap: 4px; margin-top: 20px; flex: 1; }
.side-nav button { padding: 12px; background: transparent; border: 0; border-radius: 8px; color: var(--muted); text-align: left; cursor: pointer; font-family: inherit; font-weight: 600; transition: 0.2s; }
.side-nav button:hover { background: var(--surface-2); color: var(--text); }
.side-nav button.active { background: var(--accent-soft) !important; color: var(--accent) !important; border-left: 3px solid var(--accent); }
.main { flex: 1; padding: 30px; }
.table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-md); }
.table th, .table td { padding: 14px; border-bottom: 1px solid var(--line); text-align: left; }
.table th { background: var(--surface-2); color: var(--accent); font-size: 11px; text-transform: uppercase; }
.icon-btn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body class="admin-body">
<aside class="side">
  <div style="font-family:Oswald;font-size:24px">BRATICA CRM</div>
  <nav class="side-nav" id="menu">
    <button class="active" data-section="applications">📥 Заявки</button>
    <button data-section="site_schedule">📅 Расписание сайта</button>
    <button data-section="site_prices">💳 Цены на сайте</button>
    <button data-section="clients">👥 База клиентов</button>
  </nav>
  <form method="post" action="/admin/logout" style="margin-top:auto"><button class="btn secondary small" type="submit" style="width:100%">Выйти</button></form>
</aside>
<main class="main">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px">
    <h1 id="title" style="font-family:Oswald;margin:0">Заявки</h1>
    <button class="theme-toggle" id="themeToggle"><span>Тема</span><i class="theme-track"></i></button>
  </div>
  <div id="content"></div>
</main>
<script>
const $=s=>document.querySelector(s);
let current = 'applications';

function setTheme(t){document.body.classList.toggle('light', t==='light');document.documentElement.dataset.theme=t;localStorage.setItem('bratica-theme', t);}
setTheme(localStorage.getItem('bratica-theme') || 'dark');
$('#themeToggle').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');

$('#menu').onclick = e => {
  const b = e.target.closest('[data-section]');
  if(!b) return;
  document.querySelectorAll('#menu button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  current = b.dataset.section;
  load();
};

async function load() {
  const list = await (await fetch(`/api/admin/${current}`)).json();
  const box = $('#content');
  $('#title').textContent = document.querySelector('.active').textContent;

  if(current === 'applications') {
    box.innerHTML = `<table class="table"><thead><tr><th>ID</th><th>Клиент</th><th>Направление</th><th>Удалить</th></tr></thead><tbody>${list.map(a=>`<tr><td>${a.id}</td><td><b>${a.name}</b><br>${a.phone}</td><td>${a.direction}</td><td><button class="icon-btn" onclick="delItem('${current}',${a.id})">✕</button></td></tr>`).join('')}</tbody></table>`;
  } else if (current === 'site_schedule') {
    box.innerHTML = `<button class="btn small" style="margin-bottom:20px" onclick="addSch()">+ Добавить занятие</button><table class="table"><thead><tr><th>День</th><th>Время</th><th>Название</th><th>Удалить</th></tr></thead><tbody>${list.map(s=>`<tr><td>${s.day_name}</td><td>${s.start_time}—${s.end_time}</td><td>${s.title}</td><td><button class="icon-btn" onclick="delItem('${current}',${s.id})">✕</button></td></tr>`).join('')}</tbody></table>`;
  } else if (current === 'site_prices') {
    box.innerHTML = `<table class="table"><thead><tr><th>Название</th><th>Удалить</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${p.title}</b></td><td><button class="icon-btn" onclick="delItem('${current}',${p.id})">✕</button></td></tr>`).join('')}</tbody></table>`;
  } else {
    box.innerHTML = `<table class="table"><thead><tr><th>Имя</th><th>Телефон</th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${c.name}</b></td><td>${c.phone}</td></tr>`).join('')}</tbody></table>`;
  }
}

window.delItem = async (table, id) => {
  if(confirm('Удалить запись?')) { await fetch(`/api/admin/${table}/${id}`, {method:'DELETE'}); load(); }
};

window.addSch = async () => {
  const day = prompt('День (ПН, ВТ...)');
  const start = prompt('Начало (19:00)');
  const end = prompt('Конец (20:30)');
  const title = prompt('Название (Бокс)');
  if(day && start && title) {
    await fetch('/api/admin/site_schedule', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({day_name:day, start_time:start, end_time:end, title:title, info:''})});
    load();
  }
};

load();
</script></body></html>
