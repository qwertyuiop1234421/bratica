<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRATICA CRM — Управление клубом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/bratica-2026.css">
<style>
:root { --admin-sidebar-w: 240px; }
body.admin-body { display: flex; min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
.side { width: var(--admin-sidebar-w); flex: none; background: var(--surface); border-right: 1px solid var(--line-strong); display: flex; flex-direction: column; padding: 24px 16px; min-height: 100vh; position: sticky; top: 0; z-index: 20; }
.side-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; padding: 0 8px 24px; border-bottom: 1px solid var(--line); }
.side-brand img { width: 36px; height: 36px; filter: drop-shadow(0 0 10px var(--accent-glow)); }
.side-nav { display: flex; flex-direction: column; gap: 6px; margin-top: 20px; flex: 1; }
.side-nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; background: transparent; border: 0; border-radius: var(--radius-sm); color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; transition: all 0.2s; }
.side-nav button:hover { background: var(--surface-2); color: var(--text); }
.side-nav button.active { background: var(--accent-soft) !important; color: var(--accent) !important; font-weight: 800; border-left: 3px solid var(--accent); }
.main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top-bar { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--line); background: var(--header-bg); position: sticky; top: 0; z-index: 10; }
.content-box { padding: 32px; flex: 1; }
.table-wrap { border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; box-shadow: var(--shadow-md); }
.table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
.table th { background: var(--surface-2); color: var(--accent); padding: 14px 18px; font-weight: 800; text-transform: uppercase; font-size: 11px; border-bottom: 1px solid var(--line); }
.table td { padding: 14px 18px; border-bottom: 1px solid var(--line); color: var(--text); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--text); cursor: pointer; text-decoration: none; }
.icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
.dash-card { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-sm); }
.dash-card small { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; display: block; }
.dash-card b { display: block; font-family: 'Oswald', sans-serif; font-size: 32px; margin-top: 8px; color: var(--accent); }
</style>
</head>
<body class="admin-body">
<aside class="side">
  <a class="side-brand" href="#dashboard"><img src="/static/bratica-mark.svg" alt="BRATICA"><span>BRATICA<small style="display:block;font-size:8px;font-family:Manrope;color:var(--muted)">CRM 2026</small></span></a>
  <nav class="side-nav" id="adminMenu">
    <button class="active" data-section="dashboard">📊 Сводка</button>
    <button data-section="applications">📥 Заявки</button>
    <button data-section="clients">👥 Клиенты</button>
    <button data-section="subscriptions">🎫 Абонементы</button>
    <button data-section="trainers">🥋 Тренеры</button>
    <button data-section="payments">💳 Оплаты</button>
  </nav>
  <form method="post" action="/admin/logout" style="margin-top:auto"><button class="btn secondary small" type="submit" style="width:100%">Выйти</button></form>
</aside>
<div class="main-area">
  <header class="top-bar">
    <h2 id="pageTitle" style="font-family:Oswald;font-size:24px;text-transform:uppercase;margin:0">Сводка</h2>
    <div style="display:flex;align-items:center;gap:16px">
      <button class="theme-toggle" id="adminThemeToggle" type="button"><span>Тема</span><i class="theme-track"></i></button>
      <div style="text-align:right"><b style="display:block;font-size:13px">Администратор</b><small style="color:var(--muted)">bratica@club.ru</small></div>
    </div>
  </header>
  <main class="content-box" id="mainContent"></main>
</div>
<script>
const $=s=>document.querySelector(s);const root=document.documentElement;const themeToggle=$('#adminThemeToggle');
function setTheme(t){root.dataset.theme=t;document.body.classList.toggle('light', t==='light');themeToggle.classList.toggle('light', t==='light');localStorage.setItem('bratica-theme', t);}
setTheme(localStorage.getItem('bratica-theme') || 'dark');
themeToggle.onclick=()=>setTheme(root.dataset.theme==='light'?'dark':'light');

let currentSection = 'dashboard';

$('#adminMenu').onclick = e => {
  const btn = e.target.closest('[data-section]');
  if(!btn) return;
  document.querySelectorAll('#adminMenu button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentSection = btn.dataset.section;
  loadActiveSection();
};

async function api(url, opts={}){
  try {
    const res = await fetch(url, { credentials:'include', headers:{'Content-Type':'application/json'}, ...opts });
    if(!res.ok) return null;
    return await res.json();
  } catch(e) { return null; }
}

async function loadActiveSection(){
  const main = $('#mainContent');
  $('#pageTitle').textContent = document.querySelector(`[data-section="${currentSection}"]`).textContent.replace(/^[^\s]+\s/,'');
  main.innerHTML = '<div style="color:var(--muted)">Загрузка данных...</div>';

  if(currentSection === 'dashboard') {
    const d = await api('/api/admin/dashboard') || {applications_new: 0, clients_active: 0, subscriptions_active: 0, visits_today: 0};
    main.innerHTML = `
      <div class="dash-grid">
        <div class="dash-card"><small>Новые заявки</small><b>${d.applications_new || 0}</b></div>
        <div class="dash-card"><small>Активные клиенты</small><b>${d.clients_active || 0}</b></div>
        <div class="dash-card"><small>Действующие абонементы</small><b>${d.subscriptions_active || 0}</b></div>
      </div>
    `;
  } else {
    const list = await api(`/api/admin/${currentSection}`) || [];
    main.innerHTML = `
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>ID</th><th>Инфо</th><th>Статус / Заметка</th><th style="text-align:right">Действие</th></tr></thead>
          <tbody>
            ${list.map(item => `
              <tr>
                <td>#${item.id}</td>
                <td><b>${item.name || item.title || '—'}</b><br><small style="color:var(--muted)">${item.phone || item.direction || ''}</small></td>
                <td>${item.status || item.amount || '—'}</td>
                <td style="text-align:right"><button class="icon-btn" onclick="alert('Редактирование ID: ${item.id}')">✎</button></td>
              </tr>
            `).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">Записей пока нет</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  }
}

loadActiveSection();
</script>
</body>
</html>
