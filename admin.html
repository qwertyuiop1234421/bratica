<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRATICA CRM — Управление клубом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/bratica-2026.css">
<style>
:root { --admin-sidebar-w: 250px; }
body.admin-body { display: flex; min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
.side { width: var(--admin-sidebar-w); flex: none; background: var(--surface); border-right: 1px solid var(--line-strong); display: flex; flex-direction: column; padding: 24px 16px; min-height: 100vh; position: sticky; top: 0; z-index: 20; }
.side-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; padding: 0 8px 20px; border-bottom: 1px solid var(--line); }
.side-brand img { width: 36px; height: 36px; filter: drop-shadow(0 0 10px var(--accent-glow)); }
.side-nav { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; flex: 1; }
.side-nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; background: transparent; border: 0; border-radius: var(--radius-sm); color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; transition: all 0.2s var(--ease); }
.side-nav button:hover { background: var(--surface-2); color: var(--text); }
.side-nav button.active { background: var(--accent-soft) !important; color: var(--accent) !important; font-weight: 800; border-left: 3px solid var(--accent); }
.side-nav button svg { width: 18px; height: 18px; flex: none; fill: currentColor; }
.main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top-bar { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--line); background: var(--header-bg); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); }
.content-box { padding: 32px; flex: 1; }
.table-wrap { border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; box-shadow: var(--shadow-md); }
.table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
.table th { background: var(--surface-2); color: var(--accent); padding: 14px 18px; font-weight: 800; text-transform: uppercase; font-size: 11px; border-bottom: 1px solid var(--line); letter-spacing: 0.05em; }
.table td { padding: 14px 18px; border-bottom: 1px solid var(--line); color: var(--text); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--text); cursor: pointer; text-decoration: none; transition: all 0.2s; }
.icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
.dash-card { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-sm); }
.dash-card small { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; display: block; letter-spacing: 0.05em; }
.dash-card b { display: block; font-family: 'Oswald', sans-serif; font-size: 32px; margin-top: 8px; color: var(--accent); }

/* Модальное окно редактирования */
.modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal-box { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); width: min(520px, 100%); max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); padding: 28px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-head h3 { margin: 0; font-family: 'Oswald', sans-serif; font-size: 22px; text-transform: uppercase; color: var(--text); }
.modal-close { background: transparent; border: 0; color: var(--muted); font-size: 24px; cursor: pointer; line-height: 1; }
.modal-close:hover { color: var(--accent); }
.field-grid { display: grid; gap: 14px; }
.field-group { display: grid; gap: 6px; text-align: left; }
.field-group label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.field-group input, .field-group select, .field-group textarea { width: 100%; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; font-family: inherit; box-sizing: border-box; outline: none; }
.field-group textarea { min-height: 70px; resize: vertical; }
.field-group input:focus, .field-group select:focus, .field-group textarea:focus { border-color: var(--accent); }
</style>
</head>
<body class="admin-body">
<aside class="side">
  <a class="side-brand" href="#dashboard">
    <img src="/static/bratica-mark.svg" alt="BRATICA">
    <span>BRATICA<small style="display:block;font-size:8px;font-family:Manrope;color:var(--muted);letter-spacing:0.2em">CRM 2026</small></span>
  </a>
  <nav class="side-nav" id="adminMenu">
    <button class="active" data-section="dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v4h8V3h-8z"/></svg>
      Сводка
    </button>
    <button data-section="applications">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      Заявки
    </button>
    <button data-section="site_schedule">
      <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
      Расписание сайта
    </button>
    <button data-section="clients">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      Клиенты
    </button>
    <button data-section="subscriptions">
      <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.1 0-1.99.9-1.99 2L2 19c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h2v2h2V8h8v2h2V8h2v6z"/></svg>
      Абонементы
    </button>
    <button data-section="trainers">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Тренеры
    </button>
    <button data-section="payments">
      <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      Оплаты
    </button>
  </nav>
  <form method="post" action="/admin/logout" style="margin-top:auto">
    <button class="btn secondary small" type="submit" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px">
      <svg style="width:14px;height:14px;fill:currentColor" viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
      Выйти
    </button>
  </form>
</aside>
<div class="main-area">
  <header class="top-bar">
    <h2 id="pageTitle" style="font-family:Oswald;font-size:24px;text-transform:uppercase;margin:0">Сводка</h2>
    <div style="display:flex;align-items:center;gap:16px">
      <button class="theme-toggle" id="adminThemeToggle" type="button"><span>Тема</span><i class="theme-track"></i></button>
      <div style="text-align:right"><b style="display:block;font-size:13px">Администратор</b><small style="color:var(--muted)">bratica@club.ru</small></div>
    </div>
  </header>
  <main class="content-box" id="mainContent"></main>
</div>

<div id="modalContainer"></div>

<script>
const $=s=>document.querySelector(s);const root=document.documentElement;const themeToggle=$('#adminThemeToggle');
function setTheme(t){root.dataset.theme=t;document.body.classList.toggle('light', t==='light');themeToggle.classList.toggle('light', t==='light');localStorage.setItem('bratica-theme', t);}
setTheme(localStorage.getItem('bratica-theme') || 'dark');
themeToggle.onclick=()=>setTheme(root.dataset.theme==='light'?'dark':'light');

let currentSection = 'dashboard';
let currentDataList = [];

$('#adminMenu').onclick = e => {
  const btn = e.target.closest('[data-section]');
  if(!btn) return;
  document.querySelectorAll('#adminMenu button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentSection = btn.dataset.section;
  loadActiveSection();
};

async function api(url, opts={}){
  try {
    const res = await fetch(url, { credentials:'include', headers:{'Content-Type':'application/json'}, ...opts });
    if(!res.ok) {
      const err = await res.json().catch(()=>({detail:'Ошибка запроса'}));
      throw new Error(err.detail || 'Не удалось выполнить операцию');
    }
    return await res.json();
  } catch(e) {
    console.error(e);
    return null;
  }
}

function closeModal(){ $('#modalContainer').innerHTML = ''; }

function openEditModal(title, fieldsHtml, onSave){
  $('#modalContainer').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-box">
        <div class="modal-head">
          <h3>${title}</h3>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <form id="editForm">
          <div class="field-grid">${fieldsHtml}</div>
          <div style="display:flex;gap:10px;margin-top:24px">
            <button class="btn" type="submit" style="flex:1">Сохранить</button>
            <button class="btn secondary" type="button" onclick="closeModal()">Отмена</button>
          </div>
        </form>
      </div>
    </div>
  `;
  $('#editForm').onsubmit = async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    await onSave(data);
    closeModal();
    loadActiveSection();
  };
}

async function loadActiveSection(){
  const main = $('#mainContent');
  const activeBtn = document.querySelector(`[data-section="${currentSection}"]`);
  $('#pageTitle').textContent = activeBtn ? activeBtn.textContent.trim() : 'Панель';
  main.innerHTML = '<div style="color:var(--muted)">Загрузка данных...</div>';

  if(currentSection === 'dashboard') {
    const d = await api('/api/admin/dashboard') || {applications_new: 0, clients_active: 0, subscriptions_active: 0};
    main.innerHTML = `
      <div class="dash-grid">
        <div class="dash-card"><small>Новые заявки</small><b>${d.applications_new || 0}</b></div>
        <div class="dash-card"><small>Активные клиенты</small><b>${d.clients_active || 0}</b></div>
        <div class="dash-card"><small>Действующие абонементы</small><b>${d.subscriptions_active || 0}</b></div>
      </div>
    `;
  } else if(currentSection === 'site_schedule') {
    currentDataList = await api('/api/admin/site_schedule') || [];
    main.innerHTML = `
      <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
        <button class="btn small" onclick="openCreateSchedule()">+ Добавить занятие</button>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>День</th><th>Время</th><th>Направление</th><th>Группа / Заметка</th><th style="text-align:right">Действия</th></tr></thead>
          <tbody>
            ${currentDataList.map(s => `
              <tr>
                <td><b>${s.day_name}</b></td>
                <td>${s.start_time} — ${s.end_time}</td>
                <td><b style="color:var(--accent)">${s.title}</b></td>
                <td>${s.info || '—'}</td>
                <td style="text-align:right">
                  <div style="display:inline-flex;gap:6px">
                    <button class="icon-btn" title="Редактировать" onclick="editScheduleItem(${s.id})">
                      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </button>
                    <button class="icon-btn" title="Удалить" onclick="deleteScheduleItem(${s.id})">
                      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    </button>
                  </div>
                </td>
              </tr>
            `).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--muted)">Занятий нет</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  } else {
    currentDataList = await api(`/api/admin/${currentSection}`) || [];
    main.innerHTML = `
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>ID</th><th>Инфо</th><th>Статус / Заметка</th><th style="text-align:right">Действия</th></tr></thead>
          <tbody>
            ${currentDataList.map(item => `
              <tr>
                <td>#${item.id}</td>
                <td><b>${item.name || item.title || '—'}</b><br><small style="color:var(--muted)">${item.phone || item.direction || ''}</small></td>
                <td><span style="color:var(--accent);font-weight:700">${item.status || item.amount || '—'}</span></td>
                <td style="text-align:right">
                  <div style="display:inline-flex;gap:6px">
                    <button class="icon-btn" title="Редактировать" onclick="editGenericItem(${item.id})">
                      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </button>
                    ${currentSection==='applications' ? `<button class="btn small" onclick="convertApp(${item.id})">В клиенты ↗</button>` : ''}
                  </div>
                </td>
              </tr>
            `).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">Записей пока нет</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  }
}

// Редактирование записей (Заявки, Клиенты, Тренеры, Абонементы, Оплаты)
window.editGenericItem = id => {
  const item = currentDataList.find(x => x.id === id);
  if(!item) return;

  if(currentSection === 'applications') {
    openEditModal(`Заявка #${item.id}`, `
      <div class="field-group"><label>Имя</label><input name="name" value="${item.name||''}" required></div>
      <div class="field-group"><label>Телефон</label><input name="phone" value="${item.phone||''}" required></div>
      <div class="field-group"><label>Направление</label><input name="direction" value="${item.direction||''}"></div>
      <div class="field-group"><label>Статус</label>
        <select name="status">
          <option value="new" ${item.status==='new'?'selected':''}>new (Новая)</option>
          <option value="contacted" ${item.status==='contacted'?'selected':''}>contacted (Связались)</option>
          <option value="booked" ${item.status==='booked'?'selected':''}>booked (Записан)</option>
          <option value="completed" ${item.status==='completed'?'selected':''}>completed (Клиент)</option>
          <option value="cancelled" ${item.status==='cancelled'?'selected':''}>cancelled (Отказ)</option>
        </select>
      </div>
      <div class="field-group"><label>Заметка администратора</label><textarea name="admin_note">${item.admin_note||''}</textarea></div>
    `, data => api(`/api/admin/applications/${id}`, {method:'PATCH', body:JSON.stringify(data)}));
  } else if(currentSection === 'clients') {
    openEditModal(`Клиент #${item.id}`, `
      <div class="field-group"><label>ФИО</label><input name="name" value="${item.name||''}" required></div>
      <div class="field-group"><label>Телефон</label><input name="phone" value="${item.phone||''}" required></div>
      <div class="field-group"><label>Статус</label>
        <select name="status">
          <option value="active" ${item.status==='active'?'selected':''}>active (Активен)</option>
          <option value="frozen" ${item.status==='frozen'?'selected':''}>frozen (Заморожен)</option>
        </select>
      </div>
      <div class="field-group"><label>Заметка</label><textarea name="note">${item.note||''}</textarea></div>
    `, data => api(`/api/admin/clients/${id}`, {method:'PATCH', body:JSON.stringify(data)}));
  } else if(currentSection === 'trainers') {
    openEditModal(`Тренер #${item.id}`, `
      <div class="field-group"><label>Имя</label><input name="name" value="${item.name||''}" required></div>
      <div class="field-group"><label>Телефон</label><input name="phone" value="${item.phone||''}"></div>
      <div class="field-group"><label>Направление</label><input name="direction" value="${item.direction||''}"></div>
      <div class="field-group"><label>Заметка</label><textarea name="note">${item.note||''}</textarea></div>
    `, data => api(`/api/admin/trainers/${id}`, {method:'PATCH', body:JSON.stringify(data)}));
  } else {
    openEditModal(`Редактирование #${item.id}`, `
      <div class="field-group"><label>Название / Статус</label><input name="status" value="${item.status||item.name||''}"></div>
      <div class="field-group"><label>Заметка</label><textarea name="note">${item.note||''}</textarea></div>
    `, data => api(`/api/admin/${currentSection}/${id}`, {method:'PATCH', body:JSON.stringify(data)}));
  }
};

// Редактирование расписания
window.editScheduleItem = id => {
  const s = currentDataList.find(x => x.id === id);
  if(!s) return;
  openEditModal(`Занятие в расписании`, `
    <div class="field-group"><label>День недели</label>
      <select name="day_name">
        ${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map(d=>`<option value="${d}" ${s.day_name===d?'selected':''}>${d}</option>`).join('')}
      </select>
    </div>
    <div class="field-group"><label>Время начала</label><input name="start_time" value="${s.start_time||''}" required placeholder="17:30"></div>
    <div class="field-group"><label>Время конца</label><input name="end_time" value="${s.end_time||''}" required placeholder="19:00"></div>
    <div class="field-group"><label>Направление</label><input name="title" value="${s.title||''}" required placeholder="Тайский бокс"></div>
    <div class="field-group"><label>Группа / Примечание</label><input name="info" value="${s.info||''}" placeholder="4+ или Взрослые"></div>
  `, data => api(`/api/admin/site_schedule/${id}`, {method:'PATCH', body:JSON.stringify(data)}));
};

// Добавление нового занятия
window.openCreateSchedule = () => {
  openEditModal(`Новое занятие на сайт`, `
    <div class="field-group"><label>День недели</label>
      <select name="day_name">
        <option>ПН</option><option>ВТ</option><option>СР</option><option>ЧТ</option><option>ПТ</option><option>СБ</option><option>ВС</option>
      </select>
    </div>
    <div class="field-group"><label>Время начала</label><input name="start_time" required placeholder="17:30"></div>
    <div class="field-group"><label>Время конца</label><input name="end_time" required placeholder="19:00"></div>
    <div class="field-group"><label>Направление</label><input name="title" required placeholder="Тайский бокс"></div>
    <div class="field-group"><label>Группа / Примечание</label><input name="info" placeholder="4+ или Взрослые"></div>
  `, data => api(`/api/admin/site_schedule`, {method:'POST', body:JSON.stringify(data)}));
};

window.deleteScheduleItem = async id => {
  if(confirm('Удалить это занятие из расписания?')) {
    await api(`/api/admin/site_schedule/${id}`, {method: 'DELETE'});
    loadActiveSection();
  }
};

window.convertApp = async id => {
  if(!confirm('Перевести заявку в действующего клиента?')) return;
  await api(`/api/admin/applications/${id}/convert`, {method:'POST'});
  alert('Клиент создан!');
  loadActiveSection();
};

loadActiveSection();
</script>
</body>
</html>
